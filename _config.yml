# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Simon Le Cleac'h
name: Simon Le Cleac'h
url: "https://simon-lc.github.io"
email:
description: >- # this means to ignore newlines until "baseurl:"
  Simon Le Cleac'h: robot learning and manipulation.
# an awesome description for your new site here. You can edit this
# line in _config.yml. It will appear in your document head meta (for
# Google search results) and in your feed.xml site description.
github_username: simon-lc
twitter_username: simonlc_
minimal_mistakes_skin: default
# Paste the token from Google Search Console (Settings > Ownership verification > HTML tag)
google_site_verification: "Dvdw0xkXQYe47ofW-JkRLyaflJO38ZzmwipdzM4t3ZQ"

# Google Analytics (GA4). Create a property at https://analytics.google.com,
# add a "Web" data stream for https://simon-lc.github.io, and paste its
# Measurement ID (looks like G-XXXXXXXXXX) below to enable full traffic tracking.
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-EP7S5PVHJR"
    anonymize_ip: false

search: true
search_full_content: true
lunr:
  search_within_pages: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing so they don't become public pages / sitemap entries.
exclude:
  - Gemfile
  - Gemfile.lock
  - PROMPT.md
  - prompt.md
  - README.md
  - agent/
  - _pages/about.md            # placeholder Lorem ipsum
  - _pages/category-archive.md # dead archive (front matter commented out)
  - _pages/tag-archive.md
  - _pages/year-archive.md
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Simon Le Cleac'h"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Lead research scientist at RAI<br>Stanford PhD in Robotics, ex-Google"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/simon-lc/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=PfY9_xIAAAAJ&hl=en"
    - label: "YouTube"
      icon: "fab fa-youtube"
      url: "https://www.youtube.com/@simonlc"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/simonlc_"
    # - label: "Instagram"
      # icon: "fab fa-fw fa-instagram"
      # url: "https://instagram.com/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/simon-lc/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=PfY9_xIAAAAJ&hl=en"
    - label: "YouTube"
      icon: "fab fa-youtube"
      url: "https://www.youtube.com/@simonlc"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/simonlc_"
    # - label: "Instagram"
      # icon: "fab fa-fw fa-instagram"
      # url: "https://instagram.com/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
